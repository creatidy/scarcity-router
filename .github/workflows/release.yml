# Public release pipeline (issue #97). This is the only GitHub Actions
# workflow in this repository: GitHub is the public distribution surface, not
# a second development-CI authority. Development CI runs on canonical Forgejo
# (.forgejo/workflows/ci.yml); no pull-request CI exists here by design.
#
# Two run modes, one workflow:
#
#   1. MANUAL RELEASE-CANDIDATE PREFLIGHT (workflow_dispatch). Build and
#      verify ONLY, from the exact ref the operator selects: Python
#      artifacts, the Windows worker ZIP on a real Windows runner, the
#      linux/amd64 server image (built from the committed Dockerfile,
#      offline-verified and smoke-run in an isolated container), the
#      finalized bundle, SHA256SUMS and attestations. The candidate record
#      (ref, SHA, package version) is printed; nothing is published, no tag
#      is created, no release exists, and the strict tag/main/version
#      release contract is NOT relaxed — it simply does not apply to a
#      candidate run, which never claims to be a release.
#
#   2. REAL PUBLIC RELEASE (push of a deliberate SemVer tag vX.Y.Z on
#      stable main). Fails closed unless every release invariant in
#      docs/release-engineering.md holds: strict SemVer tag, package
#      version equal to the tag (single source: scarcity_router/__init__.py),
#      tagged commit reachable from stable main, artifacts built from the
#      exact tagged commit in this same run, and artifacts passing
#      `make package-check` before any publication. It never publishes from
#      a pull-request event, and all publication identities are short-lived
#      — the run's GitHub token (Release creation, GHCR push) and OIDC
#      (attestations, PyPI). No long-lived tokens.
#
# Publication ORDERING is fail-safe by construction: EVERY public artifact —
# wheel, sdist, the Windows worker ZIP AND the server image — must build and
# pass verification BEFORE any publication. The bundle (with the Windows
# ZIP) is finalized and attested first; the GitHub Release and the GHCR
# image push are both tag-event-only and both strictly downstream of the
# finalized bundle AND the verified image; the irreversible PyPI
# publication runs LAST, strictly downstream of both. A build or
# verification failure therefore never publishes anything. That guarantee
# does NOT extend past the first successful publication: a failure of a
# publication job itself (registry outage, rejected OIDC claim, transient
# API error) can leave the ALREADY-published artifacts in place while the
# rest is missing. Recovery is deliberate and safe: every publication job
# is idempotent or repair-only (PyPI re-publishes the identical final
# bytes; the GHCR publisher never re-pushes a matching immutable version,
# repairs only missing or stale moving aliases, and never regresses newer
# stable aliases), so re-running the failed job completes the release
# without fabricating anything.
#
# Artifact transfer is structurally separated: the `pypi-packages` artifact
# carries only actual Python distributions (*.whl / *.tar.gz) and is the
# sole directory the PyPI publisher sees; the `release-bundle` artifact
# carries the distributions plus the partial SHA256SUMS; the
# `finalize-release-bundle` job — the only stage that knows every public
# payload — completes SHA256SUMS (adding the windows worker zip entry),
# re-verifies every entry against the actual bytes, attests the zip and the
# FINAL SHA256SUMS, and uploads `release-bundle-final`, the exact asset set
# the GitHub Release attaches; and the `server-image` artifact carries the
# tested container image with its own checksum and provenance record — its
# only consumer is `publish-ghcr`, and it can never enter the GitHub
# Release asset list (an explicit attachment list) or the PyPI payload
# (whitelisted upload globs). An attestation therefore always covers the
# exact bytes a consumer downloads. Release metadata (checksums, future
# provenance files) cannot enter the PyPI publication input without a
# deliberate, reviewable change to both the upload globs and the
# publication guard.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify-release-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the commit under run with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Real public-release path only: the fail-closed invariants below run
      # ONLY on the deliberate SemVer tag event. Invariants 4 and 5 are
      # structural: every later job of this run checks out and builds
      # exactly ${GITHUB_SHA}, and the artifacts must pass
      # `make package-check` before any publish job starts.
      - name: Verify release invariants (fail closed)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Invariant 1: the ref is a supported SemVer release tag vX.Y.Z.
          if ! printf '%s' "${TAG}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "FAIL: '${TAG}' is not a supported release tag (expected vX.Y.Z)" >&2
            exit 1
          fi
          VERSION="${TAG#v}"

          # Invariant 2: package version equals the release tag version. The
          # single authoritative source literal is __version__ in
          # scarcity_router/__init__.py; there is no second committed copy.
          PKG_VERSION="$(python3 -c '
          import pathlib
          import re
          text = pathlib.Path("scarcity_router/__init__.py").read_text(encoding="utf-8")
          match = re.search(r"^__version__ = \"([^\"]+)\"$", text, re.MULTILINE)
          if match is None:
              raise SystemExit("FAIL: cannot read __version__ from scarcity_router/__init__.py")
          print(match.group(1))
          ')"
          if [ "${PKG_VERSION}" != "${VERSION}" ]; then
            echo "FAIL: package version ${PKG_VERSION} != release tag version ${VERSION}" >&2
            exit 1
          fi

          # Invariant 3: the tagged commit belongs to stable main.
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          if [ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "FAIL: event commit ${GITHUB_SHA} is not the tagged commit ${TAG_COMMIT}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "FAIL: tagged commit ${TAG_COMMIT} is not reachable from stable main" >&2
            exit 1
          fi

          echo "release contract verified: tag ${TAG} == package ${PKG_VERSION} == commit ${TAG_COMMIT} on stable main"

      # Manual release-candidate preflight path: record the exact candidate
      # identity and refuse to pretend a dispatched run is a release. No
      # tag, no release, no publication happens in this mode; the strict
      # tag/main/version contract is unchanged for the real release path.
      - name: Record release-candidate identity (build/verify only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/*)
              echo "FAIL: manual dispatch must select a branch or commit ref, not a tag '${GITHUB_REF_NAME}'" >&2
              exit 1
              ;;
          esac
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_VERSION="$(python3 -c '
          import pathlib
          import re
          text = pathlib.Path("scarcity_router/__init__.py").read_text(encoding="utf-8")
          match = re.search(r"^__version__ = \"([^\"]+)\"$", text, re.MULTILINE)
          if match is None:
              raise SystemExit("FAIL: cannot read __version__ from scarcity_router/__init__.py")
          print(match.group(1))
          ')"
          {
            echo "RELEASE CANDIDATE (build/verify only — nothing is published)"
            echo "ref:     ${GITHUB_REF} (${GITHUB_REF_NAME})"
            echo "sha:     ${CANDIDATE_SHA}"
            echo "version: ${CANDIDATE_VERSION}"
          } | tee "$GITHUB_STEP_SUMMARY"

  build:
    name: build-and-verify-artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Short-lived OIDC identity for Sigstore-backed build provenance; no
      # persistent signing secret exists anywhere in this workflow.
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact commit under run
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Sync the repository-managed environment
        run: uv sync --only-dev

      # Builds wheel + sdist from this checkout, inspects contents and
      # metadata, then smoke-installs the wheel into a throwaway uv tool
      # environment (console scripts, packaged resources, MCP discovery,
      # loopback REST healthz). Nothing is published here.
      - name: Build, inspect and smoke-install the release artifacts
        run: make package-check

      - name: Generate SHA256SUMS
        run: |
          cd dist
          # Entries cover the release payloads that need checksum
          # verification: the wheel and the sdist. SHA256SUMS does not hash
          # itself; verify a downloaded release with
          # `sha256sum -c SHA256SUMS` in the directory holding the assets.
          sha256sum scarcity_router-*.whl scarcity_router-*.tar.gz | tee SHA256SUMS

      - name: Verify the release payload set (fail closed)
        run: |
          set -euo pipefail
          # dist/ must hold exactly one wheel, one sdist and SHA256SUMS;
          # nothing else may enter either publication path.
          wheel_count="$(find dist -maxdepth 1 -type f -name 'scarcity_router-*.whl' | wc -l)"
          sdist_count="$(find dist -maxdepth 1 -type f -name 'scarcity_router-*.tar.gz' | wc -l)"
          if [ "${wheel_count}" -ne 1 ] || [ "${sdist_count}" -ne 1 ]; then
            echo "FAIL: expected exactly one wheel and one sdist, found ${wheel_count}/${sdist_count}" >&2
            exit 1
          fi
          if [ ! -f dist/SHA256SUMS ]; then
            echo "FAIL: missing dist/SHA256SUMS" >&2
            exit 1
          fi
          stray="$(find dist -maxdepth 1 -type f ! -name '*.whl' ! -name '*.tar.gz' ! -name 'SHA256SUMS' ! -name '.*')"
          if [ -n "${stray}" ]; then
            echo "FAIL: unexpected files in the release payload:" >&2
            printf '%s\n' "${stray}" >&2
            exit 1
          fi
          # Hidden files (uv writes dist/.gitignore) are tool residue:
          # they match neither upload glob, so they cannot reach any
          # publication path; any non-hidden stray file fails above.

      - name: Attest build provenance (Sigstore, short-lived identity)
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          # Only artifacts whose bytes are FINAL here: the wheel and the
          # sdist. SHA256SUMS is finalized later (the windows worker zip
          # joins it) and is attested with its final bytes by the
          # finalize-release-bundle job — an attestation must always cover
          # the exact bytes a consumer downloads.
          subject-path: |
            dist/scarcity_router-*.whl
            dist/scarcity_router-*.tar.gz

      - name: Upload the PyPI payload (only actual Python distributions)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The globs below are the sole whitelist for what the PyPI
          # publisher can ever receive: checksums and future release
          # metadata do not match them by construction.
          name: pypi-packages
          path: |
            dist/scarcity_router-*.whl
            dist/scarcity_router-*.tar.gz
          if-no-files-found: error

      - name: Upload the release bundle (distributions plus checksums)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: |
            dist/scarcity_router-*.whl
            dist/scarcity_router-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  build-windows-worker:
    name: build-windows-worker-package
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # EXTERNAL_RELEASE_GATE: WINDOWS_CODE_SIGNING (docs/m10-acceptance.md).
      # When the owner configures this secret (PFX, base64) and its
      # password, the MSIX seam below activates; until then only the
      # unsigned portable zip is produced and no signature is ever
      # fabricated.
      WINDOWS_CODE_SIGNING_PFX: ${{ secrets.WINDOWS_CODE_SIGNING_PFX }}
      WINDOWS_CODE_SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
    steps:
      - name: Check out the exact commit under run
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The optional tray extra is a Windows-only convenience bundled by
      # the packaged executable; the core wheel stays dependency-clean.
      - name: Install the package with the tray extra and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[tray]" "pyinstaller>=6.11,<7"

      - name: Read the release version from the authoritative source literal
        shell: bash
        run: |
          VERSION="$(python -c '
          import pathlib, re
          text = pathlib.Path("scarcity_router/__init__.py").read_text(encoding="utf-8")
          match = re.search(r"^__version__ = \"([^\"]+)\"$", text, re.MULTILINE)
          if match is None:
              raise SystemExit("FAIL: cannot read __version__")
          print(match.group(1))
          ')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build the one-dir worker executable
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/windows/worker.spec

      - name: Stage the versioned one-dir payload
        shell: bash
        run: |
          VERSION="${{ env.VERSION }}"
          mv dist/scarcity-worker "dist/scarcity-worker-${VERSION}-windows-x64"
          cd "dist/scarcity-worker-${VERSION}-windows-x64"
          7z a "../scarcity-worker-${VERSION}-windows-x64.zip" .
          cd ..
          # Guard: exactly one zip, exactly the contracted name (D-046).
          count="$(find . -maxdepth 1 -name "scarcity-worker-${VERSION}-windows-x64.zip" | wc -l)"
          if [ "${count}" -ne 1 ]; then
            echo "FAIL: expected exactly one windows worker zip" >&2
            exit 1
          fi

      # MSIX seam (structured for the future signing certificate; D-046's
      # preferred main installation direction, subject to implementation
      # evidence). FAILS CLOSED: with signing configured, this step still
      # refuses until the MSIX manifest/assets work is implemented and
      # evidenced — an unsigned MSIX is never published silently.
      - name: MSIX packaging seam (requires signing certificate AND implementation evidence)
        if: env.WINDOWS_CODE_SIGNING_PFX != ''
        run: |
          Write-Host "EXTERNAL_RELEASE_GATE: WINDOWS_CODE_SIGNING — signing secret present, but the MSIX packaging step is not implemented yet."
          Write-Host "Implement the AppxManifest + assets layout and MakeAppx/signtool invocation with dated evidence first (docs/m10-acceptance.md)."
          exit 1

      - name: Record the external gate when signing is not configured
        if: env.WINDOWS_CODE_SIGNING_PFX == ''
        run: |
          Write-Host "EXTERNAL_RELEASE_GATE: WINDOWS_CODE_SIGNING — publishing only the unsigned portable zip; no MSIX and no signature."

      - name: Upload the windows worker artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-worker
          path: dist/scarcity-worker-*-windows-x64.zip
          if-no-files-found: error

  build-server-image:
    name: build-server-image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Build/verify only: no write permission exists in this job. The GHCR
      # publication identity (`packages: write`) exists ONLY in the
      # tag-gated `publish-ghcr` job.
      contents: read
    steps:
      - name: Check out the exact commit under run
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Read the release version from the authoritative source literal
        run: |
          VERSION="$(python3 -c '
          import pathlib
          import re
          text = pathlib.Path("scarcity_router/__init__.py").read_text(encoding="utf-8")
          match = re.search(r"^__version__ = \"([^\"]+)\"$", text, re.MULTILINE)
          if match is None:
              raise SystemExit("FAIL: cannot read __version__")
          print(match.group(1))
          ')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build the linux/amd64 server image (identity labels from this commit)
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "ghcr.io/creatidy/scarcity-router:${VERSION}" \
            .

      - name: Verify the built image identity (fail closed)
        run: |
          set -euo pipefail
          IMAGE_REF="ghcr.io/creatidy/scarcity-router:${VERSION}"
          PLATFORM="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE_REF}")"
          if [ "${PLATFORM}" != "linux/amd64" ]; then
            echo "FAIL: image platform is ${PLATFORM}, expected linux/amd64" >&2
            exit 1
          fi
          LABELS_JSON="$(docker image inspect --format '{{json .Config.Labels}}' "${IMAGE_REF}")"
          printf '%s' "${LABELS_JSON}" | LABEL_VERSION_EXPECTED="${VERSION}" LABEL_REVISION_EXPECTED="${GITHUB_SHA}" python3 -c '
          import json
          import os
          import sys
          labels = json.load(sys.stdin)
          expected = {
              "org.opencontainers.image.version": os.environ["LABEL_VERSION_EXPECTED"],
              "org.opencontainers.image.revision": os.environ["LABEL_REVISION_EXPECTED"],
          }
          wrong = {
              key: labels.get(key)
              for key, value in expected.items()
              if labels.get(key) != value
          }
          if wrong:
              raise SystemExit(f"FAIL: image identity labels mismatch: {wrong!r}")
          '

      # Offline liveness/readiness smoke of the composed server. Isolated by
      # construction: no published ports (the server keeps its default
      # loopback bind inside the container), read-only root filesystem plus
      # tmpfs /tmp, an ephemeral IN-MEMORY /data owned by the container's
      # non-root identity (uid/gid 10001, mode 0700 — a host bind would be
      # owned by the runner user and unwritable for the server), no
      # capabilities, no privilege. The only request the smoke ever makes is
      # GET /healthz — the one unauthenticated endpoint that invokes no
      # collector and reads no store.
      - name: Smoke the composed server in the built image (isolated, /healthz only)
        env:
          IMAGE_REF: "ghcr.io/creatidy/scarcity-router:${{ env.VERSION }}"
        run: |
          set -euo pipefail
          SMOKE_CONTAINER="scarcity-router-release-smoke"
          cleanup() {
            docker rm -f "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "${SMOKE_CONTAINER}" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=65536k \
            --tmpfs /data:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "${IMAGE_REF}" >/dev/null
          health=""
          for _ in $(seq 1 60); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "${SMOKE_CONTAINER}" 2>/dev/null || true)"
            if [ "${health}" = "healthy" ] || [ "${health}" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done
          if [ "${health}" != "healthy" ]; then
            docker logs "${SMOKE_CONTAINER}" >&2 || true
            echo "FAIL: server image did not become healthy (status: ${health:-unknown})" >&2
            exit 1
          fi
          status_code="$(docker exec "${SMOKE_CONTAINER}" python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8787/healthz", timeout=4).status)')"
          if [ "${status_code}" != "200" ]; then
            echo "FAIL: /healthz answered ${status_code}, expected 200" >&2
            exit 1
          fi
          echo "server image smoke verified: healthy + /healthz 200 (isolated container, ephemeral /data)"

      - name: Save the tested image with checksum and provenance
        env:
          IMAGE_REF: "ghcr.io/creatidy/scarcity-router:${{ env.VERSION }}"
        run: |
          set -euo pipefail
          mkdir -p server-image
          TAR_PATH="server-image/scarcity-router-image-${VERSION}-linux-amd64.tar"
          docker save --output "${TAR_PATH}" "${IMAGE_REF}"
          (
            cd server-image
            sha256sum "scarcity-router-image-${VERSION}-linux-amd64.tar" \
              > "scarcity-router-image-${VERSION}-linux-amd64.tar.sha256"
            sha256sum -c "scarcity-router-image-${VERSION}-linux-amd64.tar.sha256"
          )
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          PROVENANCE_VERSION="${VERSION}" PROVENANCE_REVISION="${GITHUB_SHA}" PROVENANCE_IMAGE_ID="${IMAGE_ID}" \
            python3 - > server-image/server-image-provenance.json <<'PY'
          import json
          import os
          print(json.dumps({
              "image": "ghcr.io/creatidy/scarcity-router",
              "image_id": os.environ["PROVENANCE_IMAGE_ID"],
              "platform": "linux/amd64",
              "revision": os.environ["PROVENANCE_REVISION"],
              "version": os.environ["PROVENANCE_VERSION"],
          }, indent=2, sort_keys=True))
          PY
          # Same-run intermediate only: `publish-ghcr` is the sole consumer,
          # and none of these files can enter the GitHub Release asset list
          # or the PyPI payload.
          ls -l server-image

      - name: Upload the tested server image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-image
          path: |
            server-image/scarcity-router-image-*.tar
            server-image/scarcity-router-image-*.tar.sha256
            server-image/server-image-provenance.json
          if-no-files-found: error

  finalize-release-bundle:
    name: finalize-release-bundle
    needs: [build, build-windows-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Short-lived OIDC identity for the Sigstore attestation of the
      # windows worker zip and the FINAL SHA256SUMS; no persistent
      # signing secret exists anywhere in this workflow.
      id-token: write
      attestations: write
    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: dist

      - name: Download the windows worker package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-worker
          path: dist

      - name: Finalize SHA256SUMS (verify every entry against the actual bytes)
        run: |
          cd dist
          # SHA256SUMS covers every public release payload that needs
          # checksum verification: the wheel, the sdist and the worker
          # zip. SHA256SUMS does not hash itself; verify a downloaded
          # release with `sha256sum -c SHA256SUMS` in the directory holding
          # the assets. The verification below fails the job if
          # ANY entry does not match the file actually present.
          sha256sum scarcity-worker-*-windows-x64.zip >> SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Verify the final payload set (fail closed)
        run: |
          set -euo pipefail
          # dist/ must hold exactly one wheel, one sdist, one worker zip
          # and the finalized SHA256SUMS — the complete GitHub Release
          # asset set and nothing else.
          wheel_count="$(find dist -maxdepth 1 -type f -name 'scarcity_router-*.whl' | wc -l)"
          sdist_count="$(find dist -maxdepth 1 -type f -name 'scarcity_router-*.tar.gz' | wc -l)"
          zip_count="$(find dist -maxdepth 1 -type f -name 'scarcity-worker-*-windows-x64.zip' | wc -l)"
          if [ "${wheel_count}" -ne 1 ] || [ "${sdist_count}" -ne 1 ] || [ "${zip_count}" -ne 1 ]; then
            echo "FAIL: expected exactly one wheel, one sdist and one worker zip, found ${wheel_count}/${sdist_count}/${zip_count}" >&2
            exit 1
          fi
          if [ ! -f dist/SHA256SUMS ]; then
            echo "FAIL: missing dist/SHA256SUMS" >&2
            exit 1
          fi
          entries="$(wc -l < dist/SHA256SUMS)"
          if [ "${entries}" -ne 3 ]; then
            echo "FAIL: SHA256SUMS must carry exactly three entries (wheel, sdist, zip), found ${entries}" >&2
            exit 1
          fi
          stray="$(find dist -maxdepth 1 -type f ! -name '*.whl' ! -name '*.tar.gz' ! -name 'scarcity-worker-*.zip' ! -name 'SHA256SUMS' ! -name '.*')"
          if [ -n "${stray}" ]; then
            echo "FAIL: unexpected files in the release payload:" >&2
            printf '%s\n' "${stray}" >&2
            exit 1
          fi

      - name: Attest the worker zip and the final SHA256SUMS (Sigstore, short-lived identity)
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          # The FINAL bytes a consumer downloads: the attested SHA256SUMS
          # digest is exactly the file attached to the release.
          subject-path: |
            dist/scarcity-worker-*-windows-x64.zip
            dist/SHA256SUMS

      - name: Upload the final release bundle (complete GitHub Release asset set)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-final
          path: |
            dist/scarcity_router-*.whl
            dist/scarcity_router-*.tar.gz
            dist/scarcity-worker-*-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish-github-release:
    name: publish-github-release
    # First publication of the run: it requires the finalized bundle (which
    # includes the verified Windows ZIP) AND the built-and-smoke-verified
    # server image. No build or verification failure can reach this
    # publication.
    needs: [finalize-release-bundle, build-server-image]
    # Publication runs ONLY on the deliberate SemVer tag event; a manual
    # release-candidate preflight stops after finalization and attests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the Release and attach artifacts (nothing else)
    steps:
      - name: Download the final release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-final
          path: dist

      - name: Create the GitHub Release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Explicit attachment list: bundle additions must be made
          # deliberately, never by glob accident.
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "scarcity-router ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/scarcity_router-*.whl \
            dist/scarcity_router-*.tar.gz \
            dist/scarcity-worker-*-windows-x64.zip \
            dist/SHA256SUMS

  publish-ghcr:
    name: publish-ghcr
    # GHCR publication runs ONLY on the deliberate SemVer tag event, after
    # the image build + offline smoke AND the finalized bundle (Windows ZIP
    # included), and strictly before the irreversible PyPI upload. The
    # publication identity (`packages: write` on the run's short-lived
    # token) exists ONLY in this job.
    needs: [build-server-image, finalize-release-bundle]
    if: github.event_name == 'push'
    # Repository-wide serialization for GHCR publication ONLY: the moving
    # alias decisions below (advance vs preserve) must never race another
    # release's publish-ghcr job. Running publishers are not canceled;
    # GitHub may replace a pending job, which must then be retried.
    concurrency:
      group: ghcr-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the server image to ghcr.io (nothing else)
    steps:
      - name: Download the tested server image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server-image
          path: server-image

      - name: Verify the tested image and publish to GHCR (fail closed)
        env:
          GHCR_TOKEN: ${{ github.token }} # short-lived run token; never logged
        run: |
          set -euo pipefail

          IMAGE_REPOSITORY="ghcr.io/creatidy/scarcity-router"
          IMAGE_DIR="server-image"
          EXPECTED_PLATFORM="linux/amd64"

          fail() {
            echo "FAIL: ${*}" >&2
            exit 1
          }

          # ── Runtime event/tag gate: fail closed even if the job-level
          # gate above ever regressed. Nothing registry-facing happens
          # before every check below passes.
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            fail "publish-ghcr runs only on a tag push, got event '${GITHUB_EVENT_NAME}'"
          fi
          case "${GITHUB_REF}" in
            refs/tags/*) TAG="${GITHUB_REF_NAME}" ;;
            *) fail "publish-ghcr runs only from a tag ref, got '${GITHUB_REF}'" ;;
          esac
          printf '%s' "${TAG}" \
            | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || fail "'${TAG}' is not a supported release tag (expected vX.Y.Z)"
          EXPECTED_VERSION="${TAG#v}"
          MINOR_TAG="${EXPECTED_VERSION%.*}"
          IMAGE_REF="${IMAGE_REPOSITORY}:${EXPECTED_VERSION}"

          # ── Verify the same-run artifact before anything else: exactly
          # one image tarball, checksum intact, provenance exact.
          TARBALLS="$(find "${IMAGE_DIR}" -maxdepth 1 -type f -name 'scarcity-router-image-*.tar')"
          if [ "$(printf '%s' "${TARBALLS}" | grep -c .)" -ne 1 ]; then
            fail "expected exactly one image tarball in ${IMAGE_DIR}"
          fi
          TARBALL="${TARBALLS}"
          (
            cd "${IMAGE_DIR}" \
              && sha256sum -c "$(basename "${TARBALL}").sha256" >/dev/null
          ) || fail "image tarball checksum mismatch"
          PROVENANCE="$(python3 - "${IMAGE_DIR}/server-image-provenance.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              document = json.load(handle)
          for field in ("version", "revision", "platform", "image_id"):
              value = document.get(field)
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"provenance field {field!r} missing or not a string")
          print("\n".join(document[field] for field in ("version", "revision", "platform", "image_id")))
          PY
          )" || fail "provenance record unreadable"
          {
            read -r PROVENANCE_VERSION
            read -r PROVENANCE_REVISION
            read -r PROVENANCE_PLATFORM
            read -r PROVENANCE_IMAGE_ID
          } <<< "${PROVENANCE}"
          if [ "${PROVENANCE_VERSION}" != "${EXPECTED_VERSION}" ]; then
            fail "provenance version ${PROVENANCE_VERSION} != release tag version ${EXPECTED_VERSION}"
          fi
          if [ "${PROVENANCE_REVISION}" != "${GITHUB_SHA}" ]; then
            fail "image revision ${PROVENANCE_REVISION} != commit under run ${GITHUB_SHA}"
          fi
          if [ "${PROVENANCE_PLATFORM}" != "${EXPECTED_PLATFORM}" ]; then
            fail "provenance platform ${PROVENANCE_PLATFORM} != ${EXPECTED_PLATFORM}"
          fi

          # ── Load and verify the exact image bytes (all offline): image
          # id, identity labels and platform must match the validated
          # provenance and this run's release identity exactly.
          docker load --input "${TARBALL}" >/dev/null
          LOCAL_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          if [ -z "${LOCAL_IMAGE_ID}" ]; then
            fail "loaded image ${IMAGE_REF} has no id"
          fi
          if [ "${LOCAL_IMAGE_ID}" != "${PROVENANCE_IMAGE_ID}" ]; then
            fail "loaded image id ${LOCAL_IMAGE_ID} != provenance image id ${PROVENANCE_IMAGE_ID}"
          fi
          LABELS_JSON="$(docker image inspect --format '{{json .Config.Labels}}' "${IMAGE_REF}")"
          printf '%s' "${LABELS_JSON}" | LABEL_VERSION_EXPECTED="${EXPECTED_VERSION}" LABEL_REVISION_EXPECTED="${GITHUB_SHA}" python3 -c '
          import json
          import os
          import sys
          labels = json.load(sys.stdin)
          expected = {
              "org.opencontainers.image.version": os.environ["LABEL_VERSION_EXPECTED"],
              "org.opencontainers.image.revision": os.environ["LABEL_REVISION_EXPECTED"],
          }
          wrong = {
              key: labels.get(key)
              for key, value in expected.items()
              if labels.get(key) != value
          }
          if wrong:
              raise SystemExit(f"image identity labels mismatch: {wrong!r}")
          ' || fail "loaded image identity labels do not match the release identity"
          PLATFORM="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE_REF}")"
          if [ "${PLATFORM}" != "${EXPECTED_PLATFORM}" ]; then
            fail "loaded image platform ${PLATFORM} != ${EXPECTED_PLATFORM}"
          fi

          # ── Registry session (short-lived run token only, isolated in a
          # dedicated temporary DOCKER_CONFIG that the trap removes together
          # with the stored credential; exported so docker actually uses it
          # and writes nothing outside this directory) — needed for the
          # released-version conflict gate below, never before every
          # artifact check passed.
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
          printf '%s' "${GHCR_TOKEN}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin >/dev/null \
            || fail "GHCR login failed (publication identity rejected)"

          # ── Remote manifest state. Absence is accepted ONLY for the exact
          # missing-manifest diagnostic of the docker CLI for the exact
          # reference: 'no such manifest: <ref>' (or the bare historical
          # 'no such manifest' line). Anything else — auth, transport, TLS,
          # proxy noise, an embedded 404 in a URL, a differently tagged
          # diagnostic — FAILS CLOSED; a registry failure is never read as
          # absence.
          manifest_state() {
            manifest_ref="${1}"
            manifest_error_file="$(mktemp)"
            set +e
            MANIFEST_JSON="$(docker manifest inspect --verbose "${manifest_ref}" 2>"${manifest_error_file}")"
            manifest_status=$?
            set -e
            if [ "${manifest_status}" -eq 0 ]; then
              MANIFEST_DIGEST="$(printf '%s' "${MANIFEST_JSON}" | python3 -c '
          import json
          import sys
          document = json.load(sys.stdin)
          manifest = document.get("SchemaV2Manifest")
          if not isinstance(manifest, dict):
              raise SystemExit("unexpected manifest shape (not a single-platform schema2 manifest)")
          print(manifest["config"]["digest"])
          ')" || { rm -f "${manifest_error_file}"; fail "could not read the remote manifest for ${manifest_ref}"; }
              rm -f "${manifest_error_file}"
              MANIFEST_PRESENT=1
              return 0
            fi
            MANIFEST_STDERR="$(cat "${manifest_error_file}")"
            rm -f "${manifest_error_file}"
            if [ "${MANIFEST_STDERR}" = "no such manifest: ${manifest_ref}" ] \
              || [ "${MANIFEST_STDERR}" = "no such manifest" ]; then
              MANIFEST_PRESENT=0
              return 0
            fi
            printf '%s\n' "${MANIFEST_STDERR}" >&2 || true
            fail "registry inspection of ${manifest_ref} failed with an unrecognized diagnostic; refusing to treat it as absence"
          }

          # ── Moving-alias plan. Under the job's repository-wide
          # publication lock, each moving alias (X.Y, latest) is decided
          # BEFORE any push:
          #   absent                        -> advance (push)
          #   present, exact tested bytes   -> already correct (skip)
          #   present, different content    -> pull it (read-only) and read
          #                                    its immutable version label:
          #     label is an OLDER-or-equal stable SemVer -> advance/repair
          #     label is a NEWER stable SemVer           -> preserve
          #       (an older-release retry never regresses X.Y/latest)
          #     label missing/non-stable/cross-line-minor, or the pull or
          #       any auth/network step fails -> FAIL CLOSED before any push
          # Pulling an alias only creates that alias's local tag; the
          # candidate image stays bound to the immutable version ref and its
          # verified image id.
          plan_moving_alias() {
            plan_ref="${1}"
            plan_scope="${2}"
            manifest_state "${plan_ref}"
            if [ "${MANIFEST_PRESENT}" -eq 0 ]; then
              PLAN_PUSH=1
              return 0
            fi
            if [ "${MANIFEST_DIGEST}" = "${LOCAL_IMAGE_ID}" ]; then
              PLAN_PUSH=0
              return 0
            fi
            pull_error="$(mktemp)"
            if ! docker pull "${plan_ref}" >/dev/null 2>"${pull_error}"; then
              cat "${pull_error}" >&2 || true
              rm -f "${pull_error}"
              fail "could not verify existing alias ${plan_ref} (pull failed); refusing to decide without proof"
            fi
            rm -f "${pull_error}"
            ALIAS_LABEL_VERSION="$(docker image inspect --format '{{json .Config.Labels}}' "${plan_ref}" \
              | python3 -c '
          import json
          import sys
          labels = json.load(sys.stdin)
          print(labels.get("org.opencontainers.image.version", ""))
          ')"
            PLAN_DECISION="$(python3 - "${plan_scope}" "${EXPECTED_VERSION}" "${ALIAS_LABEL_VERSION}" <<'PY'
          import re
          import sys
          stable = r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$"
          scope, ours_raw, alias_raw = sys.argv[1:4]
          def version(raw):
              if re.fullmatch(stable, raw) is None:
                  raise SystemExit(f"invalid or missing stable version label: {raw!r}")
              return tuple(int(part) for part in raw.split("."))
          ours = version(ours_raw)
          alias = version(alias_raw)
          if scope == "minor" and alias[:2] != ours[:2]:
              raise SystemExit("minor alias points outside its major.minor scope; refusing to guess")
          print("preserve" if alias > ours else "push")
          PY
          )" || fail "moving alias ${plan_ref} carries unusable metadata; refusing to guess"
            if [ "${PLAN_DECISION}" = "preserve" ]; then
              PLAN_PUSH=0
            else
              PLAN_PUSH=1
            fi
          }

          manifest_state "${IMAGE_REF}"
          if [ "${MANIFEST_PRESENT}" -eq 1 ]; then
            if [ "${MANIFEST_DIGEST}" != "${LOCAL_IMAGE_ID}" ]; then
              fail "refusing to retarget released version ${IMAGE_REF}: remote content ${MANIFEST_DIGEST} != tested image ${LOCAL_IMAGE_ID}"
            fi
            PUSH_VERSION=0
          else
            PUSH_VERSION=1
          fi

          plan_moving_alias "${IMAGE_REPOSITORY}:${MINOR_TAG}" "minor"
          PUSH_MINOR="${PLAN_PUSH}"
          plan_moving_alias "${IMAGE_REPOSITORY}:latest" "latest"
          PUSH_LATEST="${PLAN_PUSH}"

          if [ "${PUSH_VERSION}" -eq 0 ] && [ "${PUSH_MINOR}" -eq 0 ] && [ "${PUSH_LATEST}" -eq 0 ]; then
            {
              echo "immutable version ${IMAGE_REF} verified (already published with the exact tested bytes) and moving aliases current-or-newer stable; idempotent no-op (nothing pushed)"
            } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi

          # ── Publish: the immutable version first (only when it is absent),
          # then the moving tags derived from the VALIDATED version (never
          # raw event context). `latest` means the latest stable release; it
          # never refers to a develop commit because only tag runs reach
          # this step.
          if [ "${PUSH_VERSION}" -eq 1 ]; then
            docker push "${IMAGE_REF}" >/dev/null
          fi
          if [ "${PUSH_MINOR}" -eq 1 ]; then
            docker tag "${IMAGE_REF}" "${IMAGE_REPOSITORY}:${MINOR_TAG}"
            docker push "${IMAGE_REPOSITORY}:${MINOR_TAG}" >/dev/null
          fi
          if [ "${PUSH_LATEST}" -eq 1 ]; then
            docker tag "${IMAGE_REF}" "${IMAGE_REPOSITORY}:latest"
            docker push "${IMAGE_REPOSITORY}:latest" >/dev/null
          fi
          PUSHED_IDENTITY="$(docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}{{.Id}}{{end}}' "${IMAGE_REF}")"
          PUSHED_TAGS=""
          if [ "${PUSH_VERSION}" -eq 1 ]; then
            PUSHED_TAGS="${IMAGE_REPOSITORY}:${EXPECTED_VERSION}"
          fi
          if [ "${PUSH_MINOR}" -eq 1 ]; then
            PUSHED_TAGS="${PUSHED_TAGS:+${PUSHED_TAGS} }${IMAGE_REPOSITORY}:${MINOR_TAG}"
          fi
          if [ "${PUSH_LATEST}" -eq 1 ]; then
            PUSHED_TAGS="${PUSHED_TAGS:+${PUSHED_TAGS} }${IMAGE_REPOSITORY}:latest"
          fi
          {
            echo "pushed ghcr image identity (this run): ${PUSHED_IDENTITY}"
            echo "pushed tags: ${PUSHED_TAGS}"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

  publish-pypi:
    name: publish-pypi
    # IRREVERSIBLE step, therefore LAST: PyPI publication runs only after
    # the Windows worker ZIP has built, the release bundle has been
    # finalized and verified, the GitHub Release has been created AND the
    # verified server image has been pushed to GHCR — so no build or
    # verification failure can leave anything half-published, and PyPI
    # never runs on an incomplete image tag set. A failure of a publication
    # job itself is recovered by idempotent re-runs: PyPI re-publishes the
    # identical final bytes.
    needs: [publish-github-release, publish-ghcr]
    # External gate (owner action, docs/release-engineering.md): the PyPI
    # project must list this repository/workflow/environment as a Trusted
    # Publisher, and the `pypi` environment should carry required reviewers.
    # Until configured, PyPI rejects the OIDC claim and this job fails closed.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); no API token exists
    steps:
      - name: Download the PyPI payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-packages
          path: pypi-packages

      - name: Guard the publication input (only Python distributions)
        run: |
          set -euo pipefail
          # Final choke point before twine: the directory handed to
          # pypa/gh-action-pypi-publish must contain only *.whl / *.tar.gz,
          # never checksums or release metadata.
          stray="$(find pypi-packages -type f ! -name '*.whl' ! -name '*.tar.gz')"
          if [ -n "${stray}" ]; then
            echo "FAIL: non-distribution files in the PyPI payload:" >&2
            printf '%s\n' "${stray}" >&2
            exit 1
          fi
          echo "PyPI payload:"
          ls -1 pypi-packages

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: pypi-packages/
          verbose: true
