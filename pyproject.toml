# Packaging and tooling configuration for the `scarcity-router` local
# distribution (issue #63, D-034). The build backend is Hatchling and maps
# the default local selector policy into the wheel without duplicate copies.
# basedpyright remains the declared development-only gate, resolved and
# pinned via uv.lock so every run uses the same tool version.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scarcity-router"
description = "Local decision service that recommends the least scarce capable subscription-backed AI model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
]
dynamic = ["version"]

# Optional Windows tray UX for the packaged worker (M10, issue #95): never
# a core dependency — the core package stays standard-library + mcp only,
# and the PyInstaller Windows build bundles the extra.
[project.optional-dependencies]
mi = [
    "model-intelligence @ git+https://forgejo.creatidy.com/Creatidy/model-intelligence.git@d65891668b7e79f7b666c021f02a1b4bf8c4ca9c",
]
tray = [
    "pystray>=0.19,<1",
    "Pillow>=10,<13",
]

[project.scripts]
scarcity-router = "scarcity_router.cli:main"
scarcity-router-mcp = "scarcity_router.mcp:main"
scarcity-router-server = "scarcity_router.server:main"
# M10 (issue #95): the M05 native worker's console entry point. The parser
# already anticipated this invoked name; the frozen three scripts above keep
# their names and semantics untouched.
scarcity-router-worker = "scarcity_router.worker_client:main"

# The version lives only in scarcity_router/__init__.py; metadata reads it
# from there instead of committing a second copy in this file.
[tool.hatch.version]
path = "scarcity_router/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["scarcity_router"]

# The selector policy is local resource policy, not a model catalog.
[tool.hatch.build.targets.wheel.force-include]
"examples/selector-policy.json" = "scarcity_router/default-selector-policy.json"

# Minimal sdist: exactly what rebuilding the wheel requires. Tests, docs,
# tooling and local artifacts stay out of the distribution. (Hatchling
# additionally injects the standard root .gitignore and PKG-INFO.)
[tool.hatch.build.targets.sdist]
include = [
    "/scarcity_router",
    "/examples/selector-policy.json",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "model-intelligence @ git+https://forgejo.creatidy.com/Creatidy/model-intelligence.git@d65891668b7e79f7b666c021f02a1b4bf8c4ca9c",
    "basedpyright>=1.0.0",
    "mcp>=2,<3",
    # M10 (issue #95): test-only real-TLS acceptance certificates. Never a
    # runtime dependency; the product code paths create only verified,
    # default TLS contexts.
    "pyyaml>=6,<7",
    "trustme>=1,<2",
]

[tool.basedpyright]
# "recommended" is this project's selected mode; it is basedpyright's default.
# It enables all diagnostic rules and reports less severe findings as
# warnings, and the CLI's default policy fails on warnings as well, so every
# reported diagnostic is blocking for this project. Do not replace it with
# basic/standard/strict, add reportXxx = none overrides, or introduce
# baselines; fix the underlying typing instead. Any narrow suppression needs
# explicit justification.
typeCheckingMode = "recommended"
# Scope: maintained product and test code. Reconnaissance scripts in tools/
# are outside this issue's cleanup scope but are not permanently excluded;
# the gate definition stays future-compatible with including them.
include = ["scarcity_router", "tests"]
