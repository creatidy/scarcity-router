# Tooling-only configuration. There is intentionally no [project] table:
# package name, release version and publication metadata are an unresolved
# decision (U-008 in docs/decisions.md) and must not be chosen incidentally by
# development tooling. basedpyright is the declared development-only gate,
# resolved and pinned via uv.lock so every run uses the same tool version.

[dependency-groups]
dev = [
    "basedpyright>=1.0.0",
]

[tool.basedpyright]
# Explicitly document the default ruleset so the gate is self-describing and
# stable. This is not a downgrade: "recommended" is basedpyright's default and
# its strictest supported mode. Do not replace it with basic/standard/strict,
# add reportXxx = none overrides, or introduce baselines; fix the underlying
# typing instead. Any narrow suppression needs explicit justification.
typeCheckingMode = "recommended"
# Scope: maintained product and test code. Reconnaissance scripts in tools/
# are outside this issue's cleanup scope but are not permanently excluded;
# the gate definition stays future-compatible with including them.
include = ["scarcity_router", "tests"]
