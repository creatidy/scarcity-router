# Single-host installation. Do not publish these plaintext ports on the LAN.
# From the repository root: docker compose -f examples/docker-compose.yml up -d --build
# Issue the bootstrap claim in a private terminal:
# docker compose -f examples/docker-compose.yml exec scarcity-router python -m scarcity_router.control_server --data-dir /data --issue-bootstrap-claim
# Open http://127.0.0.1:8787/admin. The optional worker connects to
# srw://127.0.0.1:8790 from the host, not from another container.
# Changing the networking or port publication is the administrator's
# responsibility. For networked deployments configure verified TLS instead.
services:
  scarcity-router:
    build: ..
    command:
      - --host=0.0.0.0
      - --port=8787
      - --data-dir=/data
      - --local-container-http
      - --worker-listen-host=0.0.0.0
      - --worker-listen-port=8790
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8790:8790"
    volumes:
      - scarcity-router-data:/data
    restart: unless-stopped

volumes:
  scarcity-router-data:
